<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    padding: 6vmin;
    box-sizing: border-box;
    overflow: hidden;
  }
  img {
    max-width: min(520px, 100%);
    max-height: 100%;
    height: auto;
    width: auto;
    display: block;
    transform-origin: 50% 65%;
    animation: entrada 1.15s cubic-bezier(.22, 1, .36, 1) both;
  }

  @keyframes entrada {
    0% {
      opacity: 0;
      transform: translateY(28px) scale(.86);
    }
    55% {
      opacity: 1;
      transform: translateY(-10px) scale(1.04);
    }
    75% {
      transform: translateY(3px) scale(.99);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    img {
      animation: aparecer .4s ease-out both;
    }
    @keyframes aparecer {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  }
</style>
</head>
